name: update-readme

# Rebuilds the "Open-source contributions" section from merged PRs. Deterministic:
# reads public contribution data and rewrites one README section, then commits if changed.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # run on demand from the Actions tab
  push:
    branches: [main]
    paths: [scripts/update_contributions.py, .github/workflows/update-readme.yml]

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild contributions section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: stanleys12
        run: python3 scripts/update_contributions.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh open-source contributions"
            git push
          else
            echo "no change"
          fi
