name: snake

# Generates the contribution-snake animation and publishes the SVGs to the `output` branch,
# which the README references. Standard profile-readme pattern (Platane/snk).

on:
  schedule:
    - cron: "33 3 * * *"   # once a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Slow the snake down (scale the one master animation duration)
        run: |
          python3 - <<'PY'
          import glob, re
          FACTOR = 2.0   # higher = slower
          for f in glob.glob("dist/*.svg"):
              s = open(f).read()
              s = re.sub(r"(animation:\s*\S+\s+)(\d+)(ms)",
                         lambda m: f"{m.group(1)}{int(int(m.group(2))*FACTOR)}{m.group(3)}", s)
              open(f, "w").write(s)
          print("snake slowed", FACTOR, "x")
          PY

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
