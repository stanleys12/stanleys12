name: snake

# Builds our OWN "snake eats THIS MONTH's contributions" animation (scripts/make_snake.py) and
# publishes the SVGs to the `output` branch, which the README references. Month-scoped + slow —
# which Platane/snk couldn't do (it's year-only, fixed speed).

on:
  schedule:
    - cron: "33 3 * * *"   # once a day (so it rolls over to the new month on its own)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml, scripts/make_snake.py]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate this-month snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: stanleys12
          SNAKE_SECS_PER_CELL: "0.5"   # higher = slower (~24s loop over the 2-month grid)
        run: python3 scripts/make_snake.py

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
